      {src: 'g1', key: 'grade', val: '보급형', quote: '오버클럭 안 하면 보급형으로 충분함'},
      {src: 'g2b', key: 'grade', val: '상급형', p: 'c', side: '찬성', quote: '작업까지 하면 상급형 가라'},
      {src: 'g2a', p: 'a', side: '찬성', quote: '든든 B6 프로면 차고 넘침'},
      {src: 'g2c', p: 'a', side: '반대', quote: '첫 부팅이 느림'},
      {src: 'g1', p: 'b', side: '찬성', quote: '보급형으로 충분함'},
      {src: 'g2d', p: 'b', side: '반대', quote: 'B6 라이트는 무선랜 없으니까'},

const COMMON = {budget: ['예산', '예산은 어느 정도인가요?'], ship: ['배송 속도', '얼마나 빨리 받아야 하나요?']};

// A3: keep only claims whose quote really exists in the source
function verify(w) {
  const text = new Map();
  w.posts.forEach(p => { text.set(p.id, p.body); p.replies.forEach(r => text.set(r.id, r.body)); });
  return w.claims.filter(c => (text.get(c.src) || '').includes(c.quote));
}

// A5: at each node, pick the criterion with the smallest largest branch
// ponytail: exhaustive scan per node, index it if a category reaches thousands of products
function buildTree(w, skip = []) {
  const claims = verify(w);
  const support = k => new Set(claims.filter(c => c.key === k && !c.ad).map(c => c.src)).size;
  const supported = Object.keys(w.criteria).filter(k => support(k) >= 2);
  const fallback = supported.length === 0;
  const keys = (fallback ? Object.keys(COMMON) : supported).filter(k => !skip.includes(k));
  const names = fallback ? COMMON : w.criteria;

  function grow(products, used) {
    let best = null;
    for (const key of keys) {
      if (used.includes(key) || products.some(p => p.attr[key] === undefined)) continue;
      const groups = new Map();
      products.forEach(p => groups.set(p.attr[key], [...(groups.get(p.attr[key]) || []), p]));
      if (groups.size < 2) continue;
      const first = w.simple && key === 'cheap' ? 0 : 1;
      const score = [first, Math.max(...[...groups.values()].map(g => g.length)), -support(key)];
      const diff = best ? score.map((v, i) => v - best.score[i]).find(v => v !== 0) : -1;
      if (diff < 0) best = {key, groups, score};
    }
    if (!best || used.length === 3) return {products};
    return {
      key: best.key, name: names[best.key][0], question: names[best.key][1],
      branches: [...best.groups].map(([value, ps]) => ({value, child: grow(ps, [...used, best.key])}))
    };
  }
  return {root: grow(w.products, []), fallback};
}

function walk(root, answers) {
  let node = root;
  for (const a of answers) node = node.branches.find(b => b.value === a.value).child;
  return node;
}
const goBack = (answers, k) => answers.slice(0, k);

function approve(mode, seen, mandate, cap, days, now) {
  return {mode, seen: structuredClone(seen), budget: mandate.budget, markets: [...mandate.markets], cap, expires: now + days * 86400000, state: 'waiting'};
}

function gate(a, o, now) {
  const t = total(o), s = a.seen;
  return [
    ['승인이 유효하고 사용되지 않음', a.state === 'waiting'],
    ['승인 기한 이내', now <= a.expires],
    ['제휴몰이며 허용한 판매처', MARKETS[o.m].partner && a.markets.includes(o.m)],
    ['재고 있음', o.stock === true],
    ['총액의 모든 항목을 알고 있음', Number.isFinite(t)],
    ['확인한 상세 페이지와 동일', o.url === s.url],
    ['상품 · 모델 · 옵션 동일', o.id === s.id && o.model === s.model && o.option === s.option],
    ['판매자 동일', o.seller === s.seller],
    ['수량 동일', o.qty === s.qty],
    ['배송 · 반품 조건이 나빠지지 않음', o.eta <= s.eta && (o.returns || !s.returns)],
    ['정기결제 · 추가 상품 없음', o.extra === false],
    ['예산 이내', a.budget === null || t <= a.budget],
    a.mode === 'auto' ? ['자동결제 금액 상한 이내', t <= a.cap] : ['승인 화면에서 본 총액과 동일', t === total(s)]
  ];
}

function settle(a, o, payments, now) {
  const checks = gate(a, o, now);
  const ok = checks.every(c => c[1]);
  if (ok) {
    a.state = 'processing';
    payments.push({id: o.id, total: total(o), at: now});
    a.state = 'done';
  } else if (a.state === 'waiting') {
    a.state = now > a.expires ? 'expired' : 'halted';
  }
  return {ok, checks};
}
</script>

<script>

}

function path() {
  const known = Object.entries(W().known).map(([k, v]) => tag(`${W().criteria[k][0]}: ${v} (요청에서 확인)`));
  if (S.mandate.budget !== null) known.push(tag(`예산: ${won(S.mandate.budget)} (위임)`));
  let node = S.tree.root;
  const chosen = S.answers.map((a, k) => {
    const html = btn(`${node.name}: ${a.value}`, 'back', k, '', !!locked());
    node = node.branches.find(b => b.value === a.value).child;
    return html;
  });
  return `<nav class="path" aria-label="선택 경로">${[...known, ...chosen].join('<span aria-hidden="true">&gt;</span>')}

    ${S.approval?.state === 'waiting' ? '<p class="alert">자동결제 대기 중입니다. 위임을 취소하면 앞 질문으로 돌아갈 수 있습니다.</p>' : ''}`;
}

function treeView(node, depth = 0, on = true) {
  if (!node.key) return `<ul>${node.products.map(p => `<li><span>${p.name}</span></li>`).join('')}</ul>`;
  return `<ul class="${depth ? '' : 'tree'}"><li><b>${node.name}</b><ul>${node.branches.map(b => {
    const hit = on && S.answers[depth]?.value === b.value;
    return `<li class="${hit ? 'on' : ''}"><span>${b.value}${hit ? ' (선택)' : ''}</span>${treeView(b.child, depth + 1, hit)}</li>`;
  }).join('')}</ul></li></ul>`;
}

        <p class="small"><a href="https://www.animocabrands.com/announcement/animoca-brands-advances-digital-commerce" target="_blank" rel="noopener">공식 발표 보기</a> <span class="muted">(본 서비스와 제휴 관계 없음)</span></p></article>
    </div>`;
}

function mandate() {
  return `${steps()}<section class="card"><h1 tabindex="-1">어디까지 맡길까요?</h1>
    <p>요청: “${W().request}”</p>
    <form id="mandate" novalidate>
      <label for="budget">예산 상한 (원)</label>

      <p id="budget-help" class="small muted">비워 두면 필요할 때 예산을 질문합니다.</p>
      <label>허용할 판매처</label>
      ${Object.entries(MARKETS).map(([id, m]) =>
        `<label class="check"><input type="checkbox" name="market" value="${id}" checked>${m.name} (${m.partner ? '제휴몰, 결제 가능' : '비제휴, 링크 이동만'})</label>`).join('')}
      <div class="alert good"><b>맡기지 않는 일</b><br>상품 최종 선택, 결제 조건 변경, 카드 · 개인정보 열람</div>

function agentStep() {
  const node = walk(S.tree.root, S.answers), claims = verify(W());
  let body;
  if (node.key) {
    const why = claims.filter(c => c.key === node.key);
    body = `<section class="card"><p class="muted">질문 ${S.answers.length + 1} · 기준: ${node.name}</p><h1 tabindex="-1">${node.question}</h1>
      ${W().simple && node.key === 'cheap' ? '<p class="alert">보던 상품은 7,990원입니다. 3,540원부터 유사품이 있지만, <b>같은 상품은 아니고</b> 배송이 더 느립니다.</p>' : ''}
      ${node.branches.map((b, i) => btn(b.value, 'answer', i, 'choice')).join('')}</section>
      ${why.length ? `<section class="card"><h2>이 질문을 하는 이유</h2>${why.map(quote).join('')}</section>` : ''}`;
  } else {
    const used = claims.filter(c => !c.p && S.answers.some(a => a.key === c.key && (!c.val || c.val === a.value)));
    body = `<section class="card"><h1 tabindex="-1">내 답에 맞는 후보 ${node.products.length}개</h1>
        ${used.length ? `<h2>내 답에 반영된 의견</h2>${used.map(quote).join('')}` : ''}</section>
      <div class="grid">${node.products.map(p => {
        const said = claims.filter(c => c.p === p.id);
        return `<article class="card"><h3>${p.name}</h3><p class="small muted">${p.model}${p.diff ? ` · ${p.diff}` : ''}</p>
          ${said.length ? said.map(quote).join('') : '<p class="muted">근거 부족: 요약할 커뮤니티 의견이 없습니다.</p>'}</article>`;
      }).join('')}</div>
      ${btn('가격 · 재고 · 배송 비교하기', 'compare', '', 'main')}`;
  }
  return `${steps()}${path()}
    ${S.tree.fallback ? '<p class="alert"><b>커뮤니티 데이터가 부족합니다.</b> 의견 요약 없이 예산 · 배송 같은 공통 조건으로만 찾습니다.</p>' : ''}
    <div class="work"><div>${body}</div>${aside()}</div>`;
}

function payment() {
  const {p, o} = find(S.sel), a = S.approval, r = S.result;
  const said = verify(W()).filter(c => c.p === p.id);
  const evidence = `<h2>근거와 반대 의견</h2>${said.length ? said.map(quote).join('') : '<p class="muted">커뮤니티 근거가 부족한 상품입니다.</p>'}`;
  let body, demo = '';

  if (!a && o.stock) {
    body = `<h1 tabindex="-1">이 주문 1건을 승인할까요?</h1>${details(p, o)}${evidence}

    demo = `<p>승인 직전에 판매처 가격이 바뀌면 어떻게 될까요?</p>${btn(S.live ? '가격 인상됨 (+20,000원)' : '몰래 가격 인상', 'raise', '', 'choice', !!S.live)}`;
  } else if (!a && !S.confirmed) {
    const others = walk(S.tree.root, S.answers).products.filter(x => x.id !== p.id).map(x => x.name).join(', ');
    body = `<h1 tabindex="-1">이 상품이 맞나요?</h1><p>품절 상태입니다. 원하면 재입고 시 자동결제를 맡길 수 있습니다.</p>

      <div class="row">${btn('네, 이 상품이 맞아요', 'confirm', '', 'main')}${btn('아니요, 다시 고를게요', 'compare')}</div>`;
  } else if (!a) {
    body = `<h1 tabindex="-1">자동결제를 따로 승인해 주세요</h1><p><b>${p.name}</b> · ${o.model} · 1개</p>

        <label for="cap">배송비 포함 총액 상한 (원)</label>

        <p id="err" role="alert">${S.error}</p>
        <div class="row"><button class="btn main" type="submit">자동결제 맡기기</button>${btn('자동결제 없이 돌아가기', 'compare')}</div>
      </form>`;
  } else if (a.state === 'waiting') {
    body = `<h1 tabindex="-1">재입고를 기다리는 중</h1>
      <dl><dt>상품</dt><dd>${p.name} · 1개</dd><dt>상한</dt><dd>${won(a.cap)}</dd><dt>기한</dt><dd>${new Date(a.expires).toLocaleString('ko-KR')}</dd></dl>

      <div class="row">${btn('상품 다시 확인', 'compare', '', 'main')}</div>`;

  if (a?.mode === 'auto') {
    if (a.state === 'waiting') {
      demo = [['ok', '정상 재입고'], ['price', '가격이 올라서 재입고'], ['seller', '판매자가 바뀌어 재입고'], ['url', '다른 상세 페이지로 재입고'], ['late', '기한이 지난 뒤 재입고']]
        .map(([v, t]) => btn(t, 'event', v, 'choice')).join('') + btn('새 반대 의견 등장', 'opinion', '', 'choice');
    } else if (a.state === 'done') {
      demo = btn('같은 재입고 알림 한 번 더', 'event', 'ok', 'choice');
    } else if (a.state !== 'cancelled') {
      demo = btn('대기 상태로 되돌려 다른 상황 보기', 'rearm', '', 'choice');
    }
  }
  return `${steps()}${path()}<div class="work"><section class="card">${body}</section><aside aria-label="결제 시연">
    ${demo ? `<section class="card"><h2>시연 조작판</h2>${demo}</section>` : ''}
    ${r ? `<section class="card"><h2>결제 게이트 검사</h2><ul class="checks">${r.checks.map(([t, ok]) => `<li class="${ok ? '' : 'no'}"><b>${ok ? '통과' : '실패'}</b>${t}</li>`).join('')}</ul></section>`
      : '<section class="card"><h2>누가 결제하나요?</h2><p>AI가 아니라 규칙 코드가 조건을 검사합니다. 하나라도 다르면 결제하지 않습니다.</p></section>'}
  </aside></div>`;
}

function community(hit) {
  return `<h1 tabindex="-1">훈수광장</h1><p>깐깐한 사람들이 모인 가상의 커뮤니티입니다. 상품, 제조사, 글은 모두 가상입니다.</p>
    ${Object.values(WORLD).map(w => `<h2>${w.label}</h2>${w.posts.map(p => `<article class="card">
      <div id="src-${p.id}" class="${hit === p.id ? 'hit' : ''}">${tag(p.type, ['협찬', '수상한 글'].includes(p.type) ? 'warn' : '')}<h3>${p.title}</h3><p>${p.body}</p></div>
      ${p.replies.map(r => `<p id="src-${r.id}" class="reply ${hit === r.id ? 'hit' : ''}">${r.body}</p>`).join('')}</article>`).join('')}`).join('')}
    <a class="btn main" href="#agent">에이전트로 돌아가기</a>`;
}

function shop(id) {
  const found = id && find(id);
  if (found) {
    return `<h1 tabindex="-1">${MARKETS[found.o.m].name}</h1><p>가상 쇼핑몰 상세 페이지</p>${details(found.p, found.o)}
      ${MARKETS[found.o.m].partner ? '' : '<p class="alert">비제휴몰이라 에이전트가 결제하지 않습니다. 실제 서비스에서는 사용자가 여기서 직접 구매합니다.</p>'}
      <div class="row"><a class="btn main" href="#agent">에이전트로 돌아가기</a><a class="btn" href="#shop">전체 상품</a></div>`;
  }
  return `<h1 tabindex="-1">가상 쇼핑몰</h1>${Object.entries(MARKETS).map(([key, m]) =>
    `<h2>${m.name} ${tag(m.partner ? '제휴몰' : '비제휴')}</h2><div class="grid">${everyOffer().filter(x => x.o.m === key).map(({p, o}) =>
      `<article class="card"><h3>${p.name}</h3><p class="small muted">${o.model}</p><p class="price">${won(total(o))}</p>
      ${o.stock ? '' : tag('품절', 'bad')}${o.ad ? tag('광고', 'warn') : ''}<p><a class="btn" href="${o.url}">상세 보기</a></p></article>`).join('')}</div>`).join('')}`;
}

function render() {
  const [view, id] = location.hash.slice(1).split('/');
  const v = ['community', 'shop'].includes(view) ? view : 'agent';
  $main.innerHTML = v === 'community' ? community(id) : v === 'shop' ? shop(id) : [home, mandate, agentStep, commerce, payment][S.step]();
  document.querySelectorAll('[data-view]').forEach(a =>
    a.dataset.view === v ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  const h = $main.querySelector('h1');
  h?.focus({preventScroll: true});
  $live.textContent = h?.textContent || '';
  const target = v === 'community' && id && document.getElementById('src-' + id);
  if (target) target.scrollIntoView({block: 'center'}); else scrollTo(0, 0);
}

const clearOrder = () => Object.assign(S, {sel: null, confirmed: false, live: null, approval: null, result: null, payments: [], error: '', note: ''});
const actions = {
  reset() { S = fresh(); },
  start(id) { S = fresh(); S.id = id; S.step = 1; },
  edit() { clearOrder(); S.answers = []; S.step = 1; },
  answer(i) {
    const n = walk(S.tree.root, S.answers);
    S.answers.push({key: n.key, value: n.branches[+i].value});
  },
  back(k) {
    if (locked()) return;
    S.answers = goBack(S.answers, +k);
    clearOrder();
    S.step = 2;
  },
  compare() {
    if (locked()) return;
    clearOrder();
    S.step = 3;
  },
  select(id) { clearOrder(); S.sel = id; S.step = 4; },
  raise() {
    const o = find(S.sel).o;
    S.live = {...o, price: o.price + 20000};
  },
  pay() {
    if (S.approval) return;
    const o = find(S.sel).o, now = Date.now();
    S.approval = approve('once', o, S.mandate, null, 1, now);
    S.result = settle(S.approval, S.live || o, S.payments, now);
  },
  confirm() { S.confirmed = true; },
  cancel() { if (S.approval.state === 'waiting') S.approval.state = 'cancelled'; },
  opinion() { S.note = '새 반대 의견: “최근 물량은 초기 불량이 보인다.” 상품은 바꾸지 않았습니다. 원하면 위임을 취소하세요.'; },
  rearm() {
    if (['halted', 'expired'].includes(S.approval.state)) { S.approval.state = 'waiting'; S.result = null; }
  },
  event(kind) {
    const a = S.approval, o = {...find(S.sel).o, stock: true};
    if (kind === 'price') o.price = Math.max(o.price, a.cap) + 10000;
    if (kind === 'seller') o.seller = '이름 모를 판매자';
    if (kind === 'url') o.url += '-special';
    S.result = settle(a, o, S.payments, kind === 'late' ? a.expires + 1 : Date.now());
  }
};

document.addEventListener('click', e => {
  if (e.target.closest('#skip')) { e.preventDefault(); $main.focus(); return; }
  const b = e.target.closest('button[data-act]');
  if (b && actions[b.dataset.act]) { actions[b.dataset.act](b.dataset.v); render(); }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = new FormData(e.target);
  const fail = (msg, field) => {
    document.getElementById('err').textContent = msg;
    e.target.elements[field]?.focus?.();
  };
  if (e.target.id === 'mandate') {
    const raw = f.get('budget').trim(), budget = raw ? Number(raw) : null, markets = f.getAll('market');
    if (budget !== null && !(Number.isSafeInteger(budget) && budget > 0)) return fail('예산은 1원 이상의 정수로 입력해 주세요.', 'budget');
    if (!markets.length) return fail('판매처를 하나 이상 선택해 주세요.', 'budget');
    clearOrder();
    S.mandate = {budget, markets};
    S.tree = buildTree(W(), [...Object.keys(W().known), ...(budget === null ? [] : ['budget'])]);
    S.answers = [];
    S.step = 2;
  } else if (e.target.id === 'auto') {
    const cap = Number(f.get('cap')), days = Number(f.get('days'));
    if (!(Number.isSafeInteger(cap) && cap > 0)) return fail('상한은 1원 이상의 정수로 입력해 주세요.', 'cap');
    if (S.mandate.budget !== null && cap > S.mandate.budget) return fail('상한은 처음 정한 예산을 넘을 수 없습니다.', 'cap');
    if (!(Number.isInteger(days) && days >= 1 && days <= 30)) return fail('기한은 1일에서 30일 사이로 입력해 주세요.', 'days');
    if (!f.has('agree')) return fail('자동결제 동의에 체크해야 맡길 수 있습니다.', 'agree');
    S.approval = approve('auto', find(S.sel).o, S.mandate, cap, days, Date.now());
  }
  render();
});

addEventListener('hashchange', render);
render();
</script>
</body>
</html>
